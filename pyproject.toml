[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx2img"
version = "0.1.0"
description = "Convert PowerPoint to Pillow images and PDF using pywin32 and PyMuPDF"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "Pillow>=10",
    "PyMuPDF>=1.24.3",
    "pywin32>=306; sys_platform == 'win32'",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.scripts]
pptx2img = "pptx2img.cli:main"

[tool.setuptools.packages.find]
include = ["pptx2img*"]
